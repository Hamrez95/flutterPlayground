name: hamrez_flutter_playground
description: "A new Flutter sample project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/img/icons/
    - assets/img/posts/large/
    - assets/img/posts/small/
    - assets/img/stories/
    
  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/avenir_regular.otf
        - asset: assets/fonts/avenir_bold.otf
          weight: 700